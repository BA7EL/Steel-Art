<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steel art</title>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة AOS للانيميشن الفاخر -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <style>
        /* الأجهزة الصغيرة (الموبايل) - أقل من 600 بكسل */
        @media screen and (max-width: 600px) {
            body {
                font-size: 14px;
                padding: 10px;
            }
            .container {
                width: 100% !important;
            }
        }

        /* التابلت والأجهزة المتوسطة - من 601 إلى 1024 بكسل */
        @media screen and (min-width: 601px) and (max-width: 1024px) {
            body {
                font-size: 16px;
            }
        }

        :root {
            --bg-color: #060910;
            --text-color: #f1f5f9;
            --primary-color: #f59e0b; /* ذهبي / نحاسي راقي ومريح للعين */
            --primary-glow: rgba(245, 158, 11, 0.45);
            --secondary-color: #06b6d4;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --sparkle-color: rgba(255, 255, 255, 0.8); /* شرارات بيضاء لامعة في الوضع الليلي */
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --primary-color: #d97706;
            --primary-glow: rgba(217, 119, 6, 0.3);
            --secondary-color: #0284c7;
            --card-bg: rgba(255, 255, 255, 0.92);
            --border-color: rgba(0, 0, 0, 0.1);
            --sparkle-color: rgba(217, 119, 6, 0.5); /* شرارات ذهبية خفيفة في الوضع النهاري */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- تأثير الخلفية والشرارات المتحركة --- */
        .sparkle-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; /* خلف كل محتوى الموقع */
            pointer-events: none; /* لتتمكن من النقر على العناصر بحرية */
            overflow: hidden;
            background-color: var(--bg-color);
        }

        .sparkle-background::before,
        .sparkle-background::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: 
                radial-gradient(var(--sparkle-color) 1.5px, transparent 1.5px),
                radial-gradient(var(--sparkle-color) 1px, transparent 1px);
            background-size: 70px 70px;
            background-position: 0 0, 35px 35px;
            filter: drop-shadow(0 0 6px var(--sparkle-color));
            animation: sparkleAnimation 5s infinite linear;
            opacity: 0.2;
        }

        .sparkle-background::after {
            background-size: 100px 100px;
            background-position: 20px 20px, 60px 60px;
            animation-delay: 2.5s;
            animation-duration: 8s;
            opacity: 0.15;
        }

        @keyframes sparkleAnimation {
            0% {
                opacity: 0.1;
                transform: scale(0.95) translate(0, 0);
            }
            30% {
                opacity: 0.8;
                transform: scale(1.05) translate(8px, -8px);
            }
            70% {
                opacity: 0.3;
                transform: scale(1) translate(-5px, 10px);
            }
            100% {
                opacity: 0.1;
                transform: scale(0.95) translate(0, 0);
            }
        }

        button, .option-item, .feature-card, input, select {
            transform: scale(1);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        button:active, .option-item:active {
            transform: scale(0.96) !important;
        }

        /* شاشة البداية الاحترافية (ليزر أحمر يقطع اسم الشركة النصي) */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #020408;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: slideUpIntro 1s cubic-bezier(0.77, 0, 0.175, 1) 3.5s forwards;
        }

        .laser-container {
            position: relative;
            display: inline-block;
        }

        .intro-logo-text {
            font-size: 4.2rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 5px;
            background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            clip-path: inset(0 100% 0 0);
            animation: revealName 2s cubic-bezier(0.77, 0, 0.175, 1) 0.5s forwards;
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.5);
        }

        .red-laser-beam {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            border-right: 5px solid #ef4444;
            box-shadow: 0 0 30px 8px #ef4444, 0 0 60px 15px #dc2626;
            animation: laserCutMove 2s cubic-bezier(0.77, 0, 0.175, 1) 0.5s forwards;
            z-index: 10;
        }

        @keyframes revealName {
            0% { clip-path: inset(0 100% 0 0); }
            100% { clip-path: inset(0 0 0 0); }
        }

        @keyframes laserCutMove {
            0% { left: -100%; opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        @keyframes slideUpIntro {
            to { transform: translateY(-100%); visibility: hidden; }
        }

        /* شريط التنقل العلوي الحديث */
        header {
            position: sticky;
            top: 0;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 6%;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 1.9rem;
            font-weight: 900;
            color: var(--primary-color);
            letter-spacing: 1.2px;
            text-shadow: 0 0 18px var(--primary-glow);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 32px;
        }

        nav ul li a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            position: relative;
        }

        nav ul li a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2.5px;
            bottom: -6px;
            inset-inline-end: 0;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--primary-color);
        }

        nav ul li a:hover::after {
            width: 100%;
        }

        nav ul li a:hover {
            color: var(--primary-color);
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        select, button.control-btn {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        select:hover, button.control-btn:hover {
            border-color: var(--primary-color);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        /* واجهة Hero الفاخرة */
        .hero {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            position: relative;
            background: radial-gradient(circle at center, var(--card-bg) 0%, transparent 85%);
        }

        .hero h1 {
            font-size: 4.2rem;
            margin-bottom: 22px;
            color: var(--primary-color);
            line-height: 1.2;
            font-weight: 900;
            text-shadow: 0 0 35px var(--primary-glow);
            max-width: 1100px;
        }

        .hero p {
            font-size: 1.35rem;
            max-width: 850px;
            margin-bottom: 40px;
            line-height: 1.85;
            opacity: 0.9;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-color), #d97706);
            color: #ffffff;
            padding: 16px 45px;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            font-size: 1.2rem;
            box-shadow: 0 0 30px var(--primary-glow);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 0 45px var(--primary-color);
        }

        /* الأقسام العامة */
        section {
            padding: 120px 8%;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        section h2 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--primary-color);
            font-weight: 800;
            text-shadow: 0 0 20px var(--primary-glow);
        }

        .section-desc {
            text-align: center;
            max-width: 820px;
            margin: 0 auto 70px auto;
            font-size: 1.2rem;
            opacity: 0.88;
            line-height: 1.85;
        }

        /* عداد الخبرة والمشاريع الفاخر */
        .counter-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            text-align: center;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 70px 40px;
            margin-bottom: 80px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .counter-box h3 {
            font-size: 4.5rem;
            color: var(--primary-color);
            margin-bottom: 12px;
            font-weight: 900;
            text-shadow: 0 0 25px var(--primary-glow);
        }

        .counter-box p {
            font-size: 1.25rem;
            font-weight: 700;
        }

        /* الشبكات والكروت الزجاجية العصرية */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
        }

        .feature-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            padding: 50px 40px;
            border-radius: 20px;
            text-align: start;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        .feature-card:hover {
            transform: translateY(-10px) scale(1.01);
            border-color: var(--primary-color);
            box-shadow: 0 25px 50px var(--primary-glow);
        }

        .feature-card i {
            font-size: 3.2rem;
            color: var(--primary-color);
            margin-bottom: 25px;
            text-shadow: 0 0 20px var(--primary-glow);
        }

        .feature-card h3 {
            font-size: 1.6rem;
            margin-bottom: 18px;
            font-weight: 700;
        }

        .feature-card p {
            line-height: 1.9;
            opacity: 0.88;
            font-size: 1.12rem;
        }

        /* حاسبة البوابة المتطورة الفاخرة */
        .dimensions-box {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 55px;
            max-width: 820px;
            margin: 0 auto;
            box-shadow: 0 25px 60px rgba(0,0,0,0.35);
            position: relative;
        }

        .calc-row {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }

        .calc-col {
            flex: 1;
        }

        .form-group {
            margin-bottom: 28px;
            text-align: start;
        }

        .form-group label {
            display: block;
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        .form-group input[type="text"], 
        .form-group input[type="number"] {
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 1.2rem;
            outline: none;
        }

        .form-group input[type="number"] {
            text-align: center;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
        }

        .option-item:hover {
            border-color: var(--primary-color);
            background: rgba(245, 158, 11, 0.08);
            transform: translateX(-5px);
        }

        .option-item input[type="radio"] {
            accent-color: var(--primary-color);
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .option-item span {
            font-size: 1.1rem;
            font-weight: 600;
        }

        #sizeResultCard {
            display: none;
            margin-top: 40px;
            padding: 35px;
            background: rgba(245, 158, 11, 0.08);
            border: 2px solid var(--primary-color);
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 0 30px var(--primary-glow);
            animation: fadeInUp 0.5s ease;
        }

        #sizeResultCard h3 {
            color: var(--primary-color);
            font-size: 1.6rem;
            margin-bottom: 18px;
            font-weight: 800;
        }

        .summary-details {
            text-align: start;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 25px;
            line-height: 2.1;
            font-size: 1.15rem;
        }

        .summary-details strong {
            color: var(--primary-color);
        }

        /* الفوتر الفاخر */
        footer {
            background-color: var(--card-bg);
            backdrop-filter: blur(25px);
            border-top: 1px solid var(--border-color);
            padding: 70px 10%;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-bottom: 35px;
        }

        .social-links a {
            font-size: 2.4rem;
            color: var(--text-color);
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .social-links a:hover {
            color: var(--primary-color);
            transform: translateY(-6px) scale(1.15);
            text-shadow: 0 0 20px var(--primary-glow);
        }

        .developer {
            margin-top: 22px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .developer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 800;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .calc-row {
                flex-direction: column;
            }
            .hero h1 {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <!-- عنصر خلفية الشرارات المتحركة -->
    <div class="sparkle-background"></div>

    <!-- شاشة البداية (ليزر أحمر يقطع اسم الشركة النصي) -->
    <div id="intro-screen">
        <div class="laser-container">
            <div class="red-laser-beam"></div>
            <div class="intro-logo-text">Steel art</div>
        </div>
    </div>

    <!-- شريط التنقل العلوي -->
    <header>
        <div class="logo">Steel art</div>
        <nav>
            <ul>
                <li><a href="#about" id="t-nav-about">من نحن</a></li>
                <li><a href="#expertise" id="t-nav-exp">الخبرة الهندسية</a></li>
                <li><a href="#services" id="t-nav-services">الخدمات والشراكات</a></li>
                <li><a href="#vision" id="t-vision-vision">رؤيتنا</a></li>
                <li><a href="#calc" id="t-nav-calc">حاسبة البوابة</a></li>
            </ul>
        </nav>
        <div class="controls">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="zh">中文</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="es">Español</option>
                <option value="tr">Türkçe</option>
            </select>
            <button class="control-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></button>
        </div>
    </header>

    <!-- واجهة Hero -->
    <section class="hero">
        <h1 id="t-hero-title" data-aos="fade-down" data-aos-duration="1000">أبواب الليزر الحديثة بدقة هندسية مطلقة</h1>
        <p id="t-hero-desc" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="200">خبرة ممتدة لأكثر من 8 سنوات وأكثر من 500 مشروع ناجح تم تنفيذه بأعلى معايير الدقة والاحترافية والجمال المعماري والهندسي.</p>
        <a href="#calc" class="btn" id="t-hero-btn" data-aos="zoom-in" data-aos-duration="800" data-aos-delay="400">احسب مقاس وتجهيز بوابتك الآن</a>
    </section>

    <!-- بقية أقسام الموقع (من نحن، الخبرة، الحاسبة، إلخ...) تظل كما هي بنفس الكود السابق -->

    <!-- مكتبات JS المتقدمة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        AOS.init({
            duration: 900,
            once: true,
            offset: 100
        });

        // دالة تبديل الثيم (الوضع الليلي والنهاري) وتحديث الأيقونة
        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                themeIcon.className = 'fas fa-sun';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeIcon.className = 'fas fa-moon';
            }
        }
    </script>
</body>
</html>
